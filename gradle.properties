# 构建用 JDK 21（IDEA 2025 平台 jar 是 Java 21 字节码，JDK 17 编译不了；jvmTarget 仍为 17）。
# 本机指定方式（任选其一，均不入库）：
#   1) IDEA: Settings -> Build Tools -> Gradle -> Gradle JVM 选 21（按项目生效，推荐）
#   2) 本机 ~/.gradle/gradle.properties 中配置 org.gradle.java.home（仅本机 Gradle 构建生效）
#   3) 命令行临时指定: JAVA_HOME=<jdk21路径> ./gradlew <任务>

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false
kotlin.stdlib.default.dependency=false # 不把 kotlin-stdlib 打进插件/测试运行时 classpath（IDE 平台自带；打进测试 classpath 会因版本低于 IDE 2.2 引发 NoSuchMethodError）
